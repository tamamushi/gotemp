service: gotemp
frameworkVersion: '>=1.28.0 <2.0.0'
provider:
  name: aws
  runtime: go1.x
  region: ap-northeast-1

package:
  exclude:
    - ./**
  include:
    - ./bin/**

functions:
  invoice:
    handler: bin/invoice
    events:
      - http:
          path: /invoice
          method: get
  estimate:
    handler: bin/estimate
    events:
      - http:
          path: /estimate
          method: get
